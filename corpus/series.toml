# Series for the movements tables of the episode cards (msa-corpus series, msa-corpus episodes).
#
# [series."<id>"]: title (with the quote and unit), unit (pp: moves in percentage points;
# pct: moves in percent), since (where the download starts), source (an msa.data loader read at
# its own frequency, or the BIS API; none for a series kept only monthly), monthly (the same series in data/series, the fallback when
# the daily one is not downloaded), transform = "yoy" (an index turned into its 12-month change),
# minus (a series subtracted on common dates).
#
# [factors.<country>]: the series that measure a factor, best first; the first one with data
# around the episode is taken. "*" applies to every country. [episodes.<id>] overrides both.
# A factor without a series (bank.solvency, capital_flows, sanctions, sovereign.default...) is
# listed in the card as not measured: it is described in the chronology instead.
#
# BIS keys follow the dataflows WS_CBPOL (FREQ.REF_AREA), WS_XRU (FREQ.REF_AREA.CURRENCY.
# COLLECTION), WS_LONG_CPI (FREQ.REF_AREA.UNIT_MEASURE, 771 = year-on-year change) and WS_SPP
# (FREQ.REF_AREA.VALUE.UNIT_MEASURE, N.628 = nominal index), checked against the API on
# 2026-10-29: Egypt, Nigeria, Ghana, Lebanon and Belarus have only monthly exchange rates,
# Egypt has no policy rate and Belarus, Egypt, Sri Lanka and Ukraine no long CPI series.

