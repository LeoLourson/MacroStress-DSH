name: Bug report
description: Something computes wrong, crashes, or refuses valid input.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API keys, FRED key, or private data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or tool call, its result, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A run id, a scenario or portfolio file, or a small script.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Traceback or log
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Python, OS, and the commit or release.
      placeholder: "3.12.8, Windows 11, v0.2.0"
    validations:
      required: true
