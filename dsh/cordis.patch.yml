# Bundle layer: the whole MacroStress integration for this profile: the MCP server that owns
# the workspace and the section of the system prompt that shows its state.
#
# No path of any machine belongs here. uvx runs the package published on PyPI, and the server
# and the plugin find the same default workspace: MACROSTRESS_WORKSPACE, else
# the first existing of ~/.macrostress/workspace, the user data directory of the OS and
# ./workspace (see defaultWorkspace in index.js). A machine that needs something else overrides these two entries in
# its own profile patch; docs/howto/install.en.md shows how.
- insert:
    - id: mcp-macrostress
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: macrostress
        transport: stdio
        command: uvx
        args:
          - '--from'
          - 'macrostress>=1.1.0'
          - 'macrostress'
        env:
          PYTHONUTF8: '1'
        failOnStartupError: false
    - id: dsh-macrostress
      name: 'dsh-macrostress'
