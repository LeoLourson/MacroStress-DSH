# Average prices of a square metre by subject, a quarter each, since 2021.
[[quantities]]
id = "housing_price_primary"
label = "Цена квадратного метра на первичном рынке жилья"
unit = "руб. за м²"
transform = "log100"
regressors = ["ru.mortgage_rate", "ru.key_rate", "ru.cpi", "ru.real_wage"]
lags = 1
span = 3

[quantities.catalog]
loader = "rosstat_regions"
page = "https://rosstat.gov.ru/statistics/price"
quarterly = 'sred_cen_perv_\dkv-(\d{4})_?\.xlsx'
lag_days = 35
revised = true

[[quantities]]
id = "housing_price_secondary"
label = "Цена квадратного метра на вторичном рынке жилья"
unit = "руб. за м²"
transform = "log100"
regressors = ["ru.mortgage_rate", "ru.key_rate", "ru.cpi", "ru.real_wage"]
lags = 1
span = 3

[quantities.catalog]
loader = "rosstat_regions"
page = "https://rosstat.gov.ru/statistics/price"
quarterly = 'sred_cen_vtor_\dkv-(\d{4})_?\.xlsx'
lag_days = 35
revised = true
