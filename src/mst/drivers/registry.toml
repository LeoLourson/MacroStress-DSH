# Drivers and their satellite models (docs/scenario-formalization.md, section 6; plan, stage 4).
#
# A quantity is measured on objects; a driver is a quantity of one object. The object above an
# object (`parent`) carries the same quantity a level higher, and the satellite parameters of
# an object are drawn around those of its parent (section 6.2). Objects and drivers come from
# the quantity's `catalog` (src/mst/drivers/catalogs): `python -m mst.drivers update` lists them,
# fetches their series and writes <workspace>/drivers/catalog.json. An object no catalog covers
# can be added here as [[objects]] with [[drivers]]; a driver without `series` has no history of
# its own and takes the parameters of the level above.
#
# regressors: macro variables of x_t in the model scale y = g(X); features: declared
# max(0, y - above) terms of x_t; lags: the deepest lag of x in the equation; span: months one
# stored value covers (3 for a quarter's average), the months in between are drawn.

[[quantities]]
id = "share_price"
label = "Цена акции"
unit = "руб. за акцию"
transform = "log100"
regressors = ["ru.imoex", "ru.usdrub", "ru.key_rate", "gl.brent"]
lags = 1

[quantities.catalog]
loader = "moex_shares"
board = "TQBR"
boards = ["EQBR", "EQNE", "EQNL", "EQBS", "EQLV", "TQBR", "TQNE", "TQNL", "TQBS", "TQLV"]
root = "shares"
root_label = "Акции Московской биржи"
lag_days = 1
revised = false
sectors = [
  { id = "oil_gas", label = "Нефть и газ", index = "MOEXOG" },
  { id = "metals", label = "Металлы и добыча", index = "MOEXMM" },
  { id = "financials", label = "Финансы", index = "MOEXFN" },
  { id = "telecom", label = "Телекоммуникации", index = "MOEXTL" },
  { id = "consumer", label = "Потребительский сектор", index = "MOEXCN" },
  { id = "electric", label = "Электроэнергетика", index = "MOEXEU" },
  { id = "transport", label = "Транспорт", index = "MOEXTN" },
  { id = "chemicals", label = "Химия и нефтехимия", index = "MOEXCH" },
  { id = "it", label = "Информационные технологии", index = "MOEXIT" },
  { id = "real_estate", label = "Строительные компании и недвижимость", index = "MOEXRE" },
]

[[quantities]]
id = "bond_spread"
label = "Спред облигации к кривой ОФЗ"
unit = "п. п."
transform = "identity"
regressors = ["ru.spread_aa", "ru.spread_a", "ru.spread_bbb", "ru.key_rate", "ru.ofz_5y"]
lags = 1

[quantities.catalog]
loader = "moex_bonds"
root = "bonds"
root_label = "Корпоративные облигации"
lag_days = 1
revised = false
groups = [
  { id = "group_aa", label = "Рейтинговая группа AA", index = "RUCBCPAANS" },
  { id = "group_a", label = "Рейтинговая группа A", index = "RUCBCPANS" },
  { id = "group_bbb", label = "Рейтинговая группа BBB", index = "RUCBCPBBBNS" },
]

[[quantities]]
id = "overdue_share"
label = "Доля просроченной задолженности по кредитам организациям"
unit = "доля"
transform = "logit"
regressors = ["ru.key_rate", "ru.output", "ru.usdrub", "ru.imoex"]
features = [{ id = "key_rate_above_15", variable = "ru.key_rate", above = 15.0 }]
lags = 1

