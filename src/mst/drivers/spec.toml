# The estimation of the satellite models (docs/scenario-formalization.md, section 6.2; plan,
# stage 4). A satellite version stores this file as it was.

# The columns of z_t except the constant are centred and divided by their standard deviation
# within objects before estimation. In that scale the deviation of a coefficient of an object
# from the level above has a prior standard deviation of `spread` times the within-object
# standard deviation of the driver; the constant has `constant_spread` times it.
spread = 0.1
constant_spread = 10.0
# The largest share of the previous month a driver may keep. A draw above it is cut by the
# truncated conditional: an explosive root has no finite path, and the tridiagonal precision of
# the drawn history stops being positive definite (share_price:gazc, 13 months over 141, broke
# the Cholesky at 1.10).
rho_max = 0.99
# Months of the out-of-sample check (formalization, section 9): the models are estimated on the
# history before the last `holdout` months, and from every month of the holdout the driver is
# forecast `reach` months ahead on the realized macro variables.
holdout = 24
reach = 12

[sampler]
draws = 1000
burn = 500
seed = 20261029
