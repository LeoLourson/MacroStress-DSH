# The estimation of the satellite models (docs/concept/bvar-method-legacy.md, section 6.2).
# A satellite version stores this file as it was.

# The columns of z_t except the constant are centred and divided by their standard deviation
# within objects before estimation. In that scale the deviation of a coefficient of an object
# from the level above has a prior standard deviation of `spread` times the within-object
# standard deviation of the driver; the constant has `constant_spread` times it.
spread = 0.1
constant_spread = 10.0
# The quantities whose constant has its own spread. The candidates {10, 1, 0.1} of the satellite
# plan were compared by the mean holdout RMSE of the drivers on satellite version 2591b328: shares
# 18.25, 17.91, 17.79 (served 185, 192, 192), primary housing 12.86, 11.25, 10.75, secondary
# housing 13.16, 11.21, 10.55. At 10 the spread of the constant is ten within-object standard
# deviations, the drifts of the objects are not pooled, and a share's mean return of 2012-2026
# became its forecast. Bond spreads (3.70, 3.70, 3.81) and overdue shares (0.295, 0.300, 0.362)
# keep `constant_spread`.
constant_spreads = { share_price = 0.1, housing_price_primary = 0.1, housing_price_secondary = 0.1 }
# The largest share of the previous month a driver may keep. A draw above it is cut by the
# truncated conditional: an explosive root has no finite path, and the tridiagonal precision of
# the drawn history stops being positive definite (share_price:gazc, 13 months over 141, broke
# the Cholesky at 1.10).
rho_max = 0.99
# Months of the out-of-sample check (formalization, section 9): the models are estimated on the
# history before the last `holdout` months, and from every month of the holdout the driver is
# forecast `reach` months ahead on the realized macro variables.
holdout = 24
reach = 12
# The quantities whose equation runs on monthly changes: a share price is a trending level
# pulled towards a spurious long-run level built from trending regressors, so its satellite is
# fitted on Δd against Δx — the coefficients become elasticities and the drift a monthly one —
# and the simulation accumulates the changes from the last observed level. Housing has a
# quarterly `span`, and bonds and overdue shares are stationary: they stay in levels.
differences = ["share_price"]

[sampler]
draws = 1000
burn = 500
seed = 20261029
