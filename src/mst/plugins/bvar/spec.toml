# The estimation specification of the macro model (docs/concept/bvar-method-legacy.md, section 4).
# A model version stores this file as it was.

# T0: the first month of history.
start = 2012-01-01
# p: months of the past each variable depends on.
lags = 3
# lambda: the Minnesota tightness; smaller pulls the coefficients harder to the prior.
tightness = 0.2
# "constant" is the conjugate BVAR (s_j = 0, nu_j = infinity); "stochastic" adds stochastic
# volatility and Student tails.
volatility = "stochastic"
# Prior of each s_j^2: inverse gamma with this mean and degrees of freedom (stochastic only).
# Tight on purpose: policy rates move in steps and the Fed rate sat at zero, so with 5 degrees
# of freedom the posterior median s_j reached 4.0 a month for gl.fed_rate and 1.2 for
# ru.key_rate (store as of 2026-10-29) and simulated paths exploded within three months; with
# 60 every median stays at or below 0.2.
volvol_mean = 0.03
volvol_df = 60.0
# Variables whose prior returns them to their mean; every other one stays at its last value.
stationary = ["gl.vix", "ru.spread_aa", "ru.spread_a", "ru.spread_bbb"]
# Months after the impact month that a sign restriction also covers.
sign_lag = 2
# Rotations tried per parameter draw before the draw is dropped as unidentified.
rotation_tries = 20000
# The ceiling on the spectral radius of a parameter draw's companion matrix. A unit root
# is admissible and expected — most of these variables are nonstationary — but growth
# without bound is not: a path simulated from a draw with a larger radius drifts ever
# further, and a condition on a path multiplies the effect. The filter keeps the posterior
# restricted to the stable region, as the identification filter does.
rho_max = 1.005
# The weight of the dummy rows of Sims and Zha (1998) and Giannone, Lenza and Primiceri
# (2015): `mu` — sum-of-coefficients, `delta` — the initial observation. They act on
# levels, where the Minnesota prior weighs little (the audit of 2026-10-30), and pull
# the sums of own-lag coefficients toward one — unit roots — and away from explosive
# roots. The candidate grid of the plan (tightness in {0.05, 0.1, 0.2} with mu = delta
# in {1, 5}, the present prior as the reference) is selected by the backtest on the
# tuning half of the episodes; 1 and 1 are the values Sims and Zha recommend.
mu = 1.0
delta = 1.0
# The floor of the degrees-of-freedom grid of the Student tails: variance is infinite at
# 2 and kurtosis at 4, and for rates that sit still and then step the floor at 3 absorbs
# what the volatility process should carry — the median draw sat at it for the Fed rate,
# the key rate, the spreads and retail. 3 stays a candidate for comparison.
dof_min = 5.0

[sampler]
draws = 4000
burn = 1000
thin = 2
seed = 20261029

# Regime dummies of the Russian block. An impulse is 1 in its month only; a step is 1 from its
# month on, also over the scenario horizon.
[[dummies]]
month = 2014-11-01
kind = "impulse"
note = "переход к плавающему курсу"

[[dummies]]
month = 2022-02-01
kind = "impulse"
note = "февраль 2022 года"

[[dummies]]
month = 2022-03-01
kind = "impulse"
note = "март 2022 года"

[[dummies]]
month = 2021-01-01
kind = "step"
note = "сшивка спредов рейтинговых групп: международная шкала до 2020-12, национальная с 2021-01"
