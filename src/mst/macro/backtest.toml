# Episodes of the check of the macro model (docs/scenario-formalization.md, section 9).
# The calculation date is the day before the start month of the corpus card; the
# constrained variables follow their realized monthly path up to the end of the card's window;
# the driving shocks are those the card's sources of the time name (registry.toml, [[shocks]]).
# Each episode needs at least as many driving shocks as constrained variables, and a global
# variable needs a global shock. R1-R12 are left out: their history from 2012-01 is shorter
# than two years or empty.

draws = 1000
seed = 20261029
# Months after the start month the window runs to, as in mst.corpus.episodes.
after_months = 12

[[exclusions]]
variables = ["ru.spread_aa", "ru.spread_a", "ru.spread_bbb"]
start = 2021-01-01
reason = "сшивка индексов MOEX: международная шкала до 2020-12, национальная с 2021-01"

[[episodes]]
id = "R13"
constrained = ["ru.usdrub", "ru.key_rate"]
driving = ["ru.fx_risk", "ru.monetary"]
reason = "отток капитала и конвертация сбережений ослабили рубль, ЦБ ответил повышением ставки"
sources = ["T1/2014-2", "S2/2014-1"]

