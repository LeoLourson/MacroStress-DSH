[project]
name = "macrostress"
version = "0.1.0"
description = "Portfolio stress testing over macroeconomic scenarios, as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "LeoLourson" }]
keywords = [
  "stress-testing",
  "scenario-analysis",
  "macroeconomic",
  "bvar",
  "portfolio-risk",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "fastmcp==2.14.7",
  # Excel tables of the Bank of Russia and Rosstat archives.
  "openpyxl==3.1.5",
  # Corpus: PDF text extraction, the YAML header of a document, BM25 stems.
  "pypdf==6.21.4",
  "pyyaml==6.0.3",
  "snowballstemmer==3.1.1",
  # Corpus search vectors: multilingual-e5-small on the CPU through ONNX Runtime.
  "onnxruntime==1.31.1",
  "tokenizers==0.23.2",
  "huggingface-hub==1.33.0",
]

[project.urls]
Homepage = "https://github.com/LeoLourson/MacroStress-DSH"
Documentation = "https://github.com/LeoLourson/MacroStress-DSH/blob/main/docs/README.md"
Repository = "https://github.com/LeoLourson/MacroStress-DSH"
Issues = "https://github.com/LeoLourson/MacroStress-DSH/issues"
Changelog = "https://github.com/LeoLourson/MacroStress-DSH/blob/main/CHANGELOG.md"

[project.scripts]
macrostress = "mst.mcp:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

# The import package is mst; the distribution is macrostress.
[tool.uv.build-backend]
module-name = "mst"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "slow: estimates the BVAR and takes minutes",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
