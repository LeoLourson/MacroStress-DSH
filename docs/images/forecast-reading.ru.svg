<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Как читать прогнозный диапазон</title>
<desc id="desc">Учебный график условного показателя: линия P50 — медиана, область между P5 и P95 содержит центральные 90 процентов исходов каждого месяца. Область не означает, что 90 процентов траекторий остаются в ней весь год. Числа придуманы для объяснения и не являются результатами MacroStress.</desc>
<rect width="960" height="430" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#162b40">
<text x="32" y="36" font-size="24" font-weight="bold">Диапазон будущих значений</text>
<text x="32" y="65" font-size="16">Пример: условный индекс, начало = 100. Числа выдуманы.</text>
<line x1="94" y1="110" x2="94" y2="318" stroke="#8599ab" stroke-width="2"/>
<line x1="94" y1="318" x2="800" y2="318" stroke="#8599ab" stroke-width="2"/>
<line x1="94" y1="214" x2="800" y2="214" stroke="#d6dfe7" stroke-width="1"/>
<text x="49" y="119" font-size="16">120</text>
<text x="49" y="220" font-size="16">100</text>
<text x="58" y="320" font-size="16">80</text>
<polygon points="94,214 270,179 446,152 622,129 798,110 798,305 622,291 446,276 270,255 94,214" fill="#dce8f8"/>
<polyline points="94,214 270,179 446,152 622,129 798,110" fill="none" stroke="#627fab" stroke-width="2"/>
<polyline points="94,214 270,255 446,276 622,291 798,305" fill="none" stroke="#627fab" stroke-width="2"/>
<polyline points="94,214 270,219 446,215 622,211 798,206" fill="none" stroke="#1b5a91" stroke-width="4"/>
<text x="819" y="117" font-size="18">P95</text>
<text x="819" y="213" font-size="18" font-weight="bold">P50</text>
<text x="819" y="312" font-size="18">P5</text>
<text x="89" y="343" font-size="16">0</text>
<text x="265" y="343" font-size="16">3</text>
<text x="441" y="343" font-size="16">6</text>
<text x="617" y="343" font-size="16">9</text>
<text x="787" y="343" font-size="16">12</text>
<text x="825" y="343" font-size="16">месяц</text>
<text x="316" y="190" font-size="18">Центральные 90 % исходов</text>
</g>
</svg>
