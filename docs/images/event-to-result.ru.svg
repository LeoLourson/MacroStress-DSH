<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">От события к условному прогнозу</title>
<desc id="desc">Человек описывает событие. Агент по источникам готовит сценарий. Человек утверждает условия. Экономические модели рассчитывают распределение показателей. История нужна моделям, а корпус — автору сценария.</desc>
<rect width="960" height="410" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#162b40">
<text x="32" y="38" font-size="24" font-weight="bold">Зоны ответственности</text>
<rect x="32" y="80" width="250" height="112" rx="12" fill="#eef3f8" stroke="#8599ab"/>
<text x="50" y="110" font-size="20" font-weight="bold">Человек → событие</text>
<text x="50" y="141" font-size="17">«Ставка 21 % на год»</text>
<text x="50" y="169" font-size="16">Пример условия</text>
<line x1="282" y1="136" x2="333" y2="136" stroke="#405e79" stroke-width="3"/>
<polyline points="323,128 333,136 323,144" fill="none" stroke="#405e79" stroke-width="3"/>
<rect x="340" y="80" width="280" height="112" rx="12" fill="#eaf5f3" stroke="#538f84"/>
<text x="358" y="110" font-size="20" font-weight="bold">Агент → сценарий</text>
<text x="358" y="141" font-size="17">Числа, месяцы, источники</text>
<text x="358" y="169" font-size="16">Вмешательства и наблюдения</text>
<line x1="620" y1="136" x2="671" y2="136" stroke="#405e79" stroke-width="3"/>
<polyline points="661,128 671,136 661,144" fill="none" stroke="#405e79" stroke-width="3"/>
<rect x="678" y="80" width="250" height="112" rx="12" fill="#fff5de" stroke="#b89144"/>
<text x="696" y="110" font-size="20" font-weight="bold">Человек → решение</text>
<text x="696" y="141" font-size="17">Проверяет условия</text>
<text x="696" y="169" font-size="16">Утверждает сценарий</text>
<line x1="803" y1="192" x2="803" y2="254" stroke="#405e79" stroke-width="3"/>
<polyline points="795,244 803,254 811,244" fill="none" stroke="#405e79" stroke-width="3"/>
<rect x="32" y="272" width="250" height="104" rx="12" fill="#eef3f8" stroke="#8599ab"/>
<text x="50" y="303" font-size="20" font-weight="bold">Результат</text>
<text x="50" y="334" font-size="17">Распределение показателей</text>
<text x="50" y="361" font-size="16">И потерей для портфеля</text>
<line x1="340" y1="324" x2="289" y2="324" stroke="#405e79" stroke-width="3"/>
<polyline points="299,316 289,324 299,332" fill="none" stroke="#405e79" stroke-width="3"/>
<rect x="340" y="272" width="588" height="104" rx="12" fill="#edf1fb" stroke="#788dc4"/>
<text x="358" y="303" font-size="20" font-weight="bold">Экономические модели → расчёт</text>
<text x="358" y="334" font-size="17">Общие траектории от экономики к целевому показателю</text>
<text x="358" y="361" font-size="16">История + версии моделей + горизонт + число путей</text>
<text x="32" y="231" font-size="16">Корпус обосновывает условия; последствия рассчитывают модели.</text>
</g>
</svg>
