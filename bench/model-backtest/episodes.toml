# Episodes of the check of the macro model (docs/concept/bvar-method-legacy.md, «Проверка»).
# The calculation date is the day before the start month `start` of the episode; `card` names
# the corpus card of the same event, which tests/test_bench.py holds to the same start.
#
# Each episode splits the variables whose realized paths fix the scenario into two lists:
# `observations` — outcomes the system produces itself (the rouble, oil, inflation, a spread,
# an index), which follow their realized monthly path to the end of the window; and
# `interventions` — actual decisions of a subject outside the models (a central bank raising or
# cutting the key rate), which are applied as a `set` of the realized level in those months and
# whose cells do not enter the CRPS. The rule is who chose the value, not which quantity it
# names: a production quota that moves the oil price does not set the price, so oil stays an
# observation, while every change of the key rate in the card is a decision and becomes an
# intervention. Each episode is classified by its own reason text. R1-R12 are left out: their
# history from 2012-01 is shorter than two years or empty.
#
# Every episode carries two marks, both decisions of a human kept in this plan:
# - half = "tuning" | "validation": the models are fitted on the first half and checked on the
#   second; the final table is built over all episodes. Both halves must stay non-empty.
# - source = "manual" | "llm": who formalised the scenario. The scenario utility reports the
#   two apart; an llm mark is only trusted in calculations forward of its formalisation date.
# The set grows as new historical events are carded; the marks travel with their episodes.
#
# The [rolling] block turns the rolling check on: step_months is the step of the date grid the
# models are re-estimated on, validation_from starts the validation half of the grid, and
# [[rolling.price_events]] names the family of events the price is checked on (fixed before the
# check, independent of the dates; the events are data of this plan, not of the code). The grid
# judges the forecast itself, on dates nobody selected: the episodes below are the events a
# conditional forecast is asked about, not a sample of history.

draws = 1000
seed = 20261029
# Months after the start month the window runs to, as in mst.corpus.episodes.
after_months = 12

[rolling]
step_months = 3
validation_from = 2021-01-01

[[exclusions]]
variables = ["ru.spread_aa", "ru.spread_a", "ru.spread_bbb"]
start = 2021-01-01
reason = "сшивка индексов MOEX: международная шкала до 2020-12, национальная с 2021-01"

