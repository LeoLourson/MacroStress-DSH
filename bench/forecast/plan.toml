# The forecast check set: every number here is fixed before a result is read, and a change of
# a threshold is a commit of this file. `python -m mst.bench forecast` reads it.

# The portfolio of the workspace whose losses are checked.
portfolio = "fifth-test"
# The first change month of every historical comparison: the rouble floats from November 2014.
history_start = 2015-01-01
horizons = [1, 3, 12]
# The central band: width = q95 - q05, coverage = the share of facts between them.
band = 0.90
draws = 2000
seed = 20261115

# The three spread indexes were spliced in January 2021: that change is not a market move.
[[splices]]
month = 2021-01-01
variables = ["ru.spread_aa", "ru.spread_a", "ru.spread_bbb"]

[gates]
# The model's quantile width over the historical one, for every series and horizon.
width = [0.75, 1.40]
# The share of the macro variables of one horizon whose width must pass.
width_share = 0.8
# The largest distance of the mean pair correlation of 12-month share returns from history.
correlation = 0.15
# Out of sample, the forecast of every level is checked by `python -m mst.metrics rolling`
# with --drivers and --portfolio, on the grid of bench/model-backtest/episodes.toml.

# The events: ordinary runs of these scenarios of the workspace on the checked versions, with
# the contribution of every element. A run compares itself with the empty scenario on the same
# random numbers; the medians by month are compared with the base run on the same seed.
[events]
base = "base-2026-10"
scenarios = [
    "cbr-cut-5pp-random",
    "cbr-cut-5pp-market-reaction-random",
    "cbr-target-6-7-random",
    "bank-admin-top5-random",
    "cn-bank-payments-stop-random",
    "dividends-a-random",
    "dividends-b-random",
    "fed-zero-gold-random",
    "fuel-export-ban-random",
    "hormuz-closure-2m-random",
    "migrant-ban-random",
    "sbp-outage-10d-random",
]
draws = 2000
contributions = true
