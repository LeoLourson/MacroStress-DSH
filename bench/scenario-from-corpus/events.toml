# Events the agent turns into scenarios by the skill scenario-from-corpus.
#
# None of these events happened by the day the set was written (2026-11-03), so the agent
# cannot know their outcome; the set checks how the scenario is built, not what history did.
# Each event is the text a user would send, nothing more: the expected decisions are kept
# apart, outside the agent's working folder, because an agent that has read them makes the
# check worthless. Nothing in this file hints at the answer, and no field may be added that
# does.
#
# An event without a date starts in the first month after the as_of of the model version, as
# the skill says. An id is never reused and the text under an id is never edited once a
# result refers to it: a changed event gets a new id.

